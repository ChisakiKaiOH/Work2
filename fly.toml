# fly.toml app configuration file generated for work2-2yfrnw on 2026-09-18T12:42:35Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'work2-2yfrnw'
primary_region = 'ams'

[build]

[env]
  HOST = '0.0.0.0'
  PORT = '8080'
  SHIE_DATA_DIR = '/data'

[[mounts]]
  source = 'shie_data'
  destination = '/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = 'shared-cpu-1x'
  memory = '256mb'
